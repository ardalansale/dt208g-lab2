<!DOCTYPE html>
<html lang="sv">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Laboration 2 - Objektorienterad programmering</title>

<body>
    <main>
        <h1>Att göra‑lista</h1>

        <form id="todoForm">
            <input id="task" type="text" placeholder="Ny uppgift">
            <select id="priority">
                <option value="1">1 Hög prioritet</option>
                <option value="2">2 Medel prioritet</option>
                <option value="3">3 Låg prioritet</option>
            </select>
            <button type="submit">Lägg till</button>
        </form>

        <div id="error"></div>

        <div id="todoContainer"></div>

        <script type="module" src="/src/main.ts"></script>
    </main>
    <footer>
        <p>DT208G Programmering i TypeScript</p>
        <p>Laboration 2 - Objektorienterad programmering</p>
        <p>MIUN</p>
        <p>Ardalan Sale</p>
